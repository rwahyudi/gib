<svg xmlns="http://www.w3.org/2000/svg" width="980" height="610" viewBox="0 0 980 610" role="img" aria-labelledby="title desc">
  <title id="title">ib Badger cache namespaces</title>
  <desc id="desc">Scoped Badger cache namespaces for DNS zones and records, IPAM network views, networks, containers, addresses, VLANs, and lease-protected refresh locks. Identity includes profile, normalized endpoint, username, and the relevant view or network scope.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#f5f5f7"/></linearGradient><style>text{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#1d1d1f;font-size:23px;font-weight:800}.l{fill:#1d1d1f;font-size:15px;font-weight:700}.b{fill:#6e6e73;font-size:12px}.s{fill:#86868b;font-size:11px}.box{fill:#ffffff;stroke-width:1.3}.row{stroke:#d2d2d7}</style></defs>
  <rect width="980" height="610" rx="24" fill="#f5f5f7"/><rect x="28" y="28" width="924" height="554" rx="18" fill="#ffffff" stroke="#d2d2d7"/><text x="55" y="67" class="h">Badger cache namespaces</text><text x="55" y="91" class="b">Every row is isolated by profile, endpoint, user, and DNS/IPAM scope.</text>
  <g transform="translate(55 120)"><rect width="270" height="142" rx="14" class="box" stroke="#0071e3"/><text x="20" y="30" class="l">DNS</text><text x="20" y="58" class="mono b">zones / identity / view</text><line x1="20" y1="70" x2="250" y2="70" class="row"/><text x="20" y="94" class="mono b">records / identity / view / zone</text><text x="20" y="119" class="s">cached_at · zone_serial · stale_expires_at</text></g>
  <g transform="translate(355 120)"><rect width="270" height="142" rx="14" class="box" stroke="#34c759"/><text x="20" y="30" class="l">IPAM</text><text x="20" y="58" class="mono b">network_views</text><text x="20" y="80" class="mono b">networks · network_containers</text><text x="20" y="102" class="mono b">ipv4_addresses</text><text x="20" y="124" class="s">network view / IP scope</text></g>
  <g transform="translate(655 120)"><rect width="244" height="142" rx="14" class="box" stroke="#ff9f0a"/><text x="20" y="30" class="l">VLAN</text><text x="20" y="58" class="mono b">vlans / identity / view</text><line x1="20" y1="70" x2="224" y2="70" class="row"/><text x="20" y="94" class="b">derived from network metadata</text><text x="20" y="119" class="s">SWR + background refresh</text></g>
  <g transform="translate(55 300)"><rect width="420" height="150" rx="14" class="box" stroke="#ff3b30"/><text x="20" y="31" class="l">Refresh leases</text><text x="20" y="61" class="mono b">record_refresh_locks</text><text x="20" y="84" class="mono b">net_refresh_locks</text><text x="20" y="115" class="s">scope + started_at + expires_at</text><text x="20" y="134" class="s">prevents duplicate detached refresh work</text></g>
  <g transform="translate(505 300)"><rect width="394" height="150" rx="14" class="box" stroke="#86868b"/><text x="20" y="31" class="l">Shared identity</text><text x="20" y="61" class="mono b">profile · normalized endpoint · user</text><text x="20" y="84" class="mono b">DNS view / zone · network view / IP</text><text x="20" y="115" class="s">JSON payloads normalized on read</text><text x="20" y="134" class="s">local: ~/.ib/cache.badger/</text></g>
  <rect x="55" y="490" width="844" height="54" rx="13" fill="#f0f6ff" stroke="#0369a1"/><text x="75" y="513" class="b">Freshness is computed from cached_at + cache_ttl.</text><text x="75" y="532" class="s">Record and targeted IPAM/VLAN rows may remain available through stale_expires_at; list/search can prefer cached IPAM rows.</text>
</svg>
