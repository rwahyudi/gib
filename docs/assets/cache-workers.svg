<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" role="img" aria-labelledby="title desc">
  <title id="title">ib bounded search workers and cache routing</title>
  <desc id="desc">A configurable worker pool preloads cache rows, searches zones in parallel, and sends read-only GET traffic to the validated read endpoint with an optional primary share. Stale zones enter one lease-protected batch revalidation helper; writes and next-IP calls use the primary Grid Master.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#f8fafc;font-size:25px;font-weight:800}.l{fill:#e2e8f0;font-size:16px;font-weight:700}.b{fill:#cbd5e1;font-size:13px}.s{fill:#94a3b8;font-size:12px}.card{fill:#0b1220;stroke:#263244;stroke-width:1.3}.line{fill:none;stroke-width:2.3;marker-end:url(#a)}</style></defs>
  <rect width="980" height="560" rx="24" fill="url(#bg)"/><rect x="28" y="28" width="924" height="504" rx="18" fill="#0b1220" stroke="#263244"/><text x="55" y="68" class="h">Search workers, cache, and WAPI lanes</text><text x="55" y="94" class="b">Preload once, fan out within the configured limit, then batch stale revalidation.</text>
  <g transform="translate(55 132)"><rect width="185" height="100" rx="14" class="card" stroke="#38bdf8"/><text x="18" y="31" class="l">Search scheduler</text><text x="18" y="56" class="b">active/root zone first</text><text x="18" y="76" class="b">then cached-size order</text><text x="18" y="92" class="s mono">limit = dns_search_worker_limit</text></g>
  <path d="M240 182h35" class="line" stroke="#38bdf8"/>
  <g transform="translate(275 118)"><rect width="210" height="128" rx="14" class="card" stroke="#22c55e"/><text x="18" y="31" class="l">Preloaded cache rows</text><text x="18" y="57" class="b">one Badger handle</text><text x="18" y="78" class="b">fresh or SWR rows</text><text x="18" y="101" class="s">missing rows fall back</text></g>
  <path d="M485 150h45M485 214h45" class="line" stroke="#22c55e"/>
  <g transform="translate(530 112)"><rect width="195" height="62" rx="12" class="card" stroke="#22c55e"/><text x="18" y="27" class="l">Worker pool</text><text x="18" y="48" class="s">bounded zone fan-out</text></g><g transform="translate(530 190)"><rect width="195" height="62" rx="12" class="card" stroke="#fbbf24"/><text x="18" y="27" class="l">Batch queue</text><text x="18" y="48" class="s">stale zones after search</text></g>
  <path d="M725 143h38M725 221h38" class="line" stroke="#38bdf8"/>
  <g transform="translate(763 105)"><rect width="145" height="78" rx="13" class="card" stroke="#38bdf8"/><text x="18" y="29" class="l">Read GETs</text><text x="18" y="51" class="b">read endpoint</text><text x="18" y="68" class="s">+ optional primary share</text></g><g transform="translate(763 204)"><rect width="145" height="78" rx="13" class="card" stroke="#fbbf24"/><text x="18" y="29" class="l">Revalidate</text><text x="18" y="51" class="b">one helper</text><text x="18" y="68" class="s">lease-protected</text></g>
  <g transform="translate(55 315)"><rect width="430" height="120" rx="14" class="card" stroke="#22c55e"/><text x="20" y="31" class="l">Cache decisions per zone</text><text x="20" y="59" class="b">fresh → return · stale in SWR → return + queue</text><text x="20" y="80" class="b">matching SOA serial → renew locally</text><text x="20" y="101" class="s">changed / missing / expired → WAPI refresh</text></g>
  <g transform="translate(530 315)"><rect width="378" height="120" rx="14" class="card" stroke="#22c55e"/><text x="20" y="31" class="l">Primary-only operations</text><text x="20" y="59" class="b">POST · PUT · DELETE · next-IP</text><text x="20" y="80" class="b">always use the primary Grid Master</text><text x="20" y="101" class="s">successful/failed writes may emit audit JSONL</text></g>
  <text x="55" y="485" class="s">Traffic colors: cyan read GET · green cache/write · amber background revalidation.</text>
</svg>
