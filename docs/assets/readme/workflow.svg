<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
  <title id="title">ib cache, read, write, worker, and audit model</title>
  <desc id="desc">The CLI resolves shell context, checks cache freshness, and sends read-only GET traffic to a validated read endpoint with an optional primary worker share. Writes and next-IP calls use the primary Grid Master. Stale data refreshes through lease-protected workers, while write results can emit redacted JSONL audit events.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#f8fafc;font-size:31px;font-weight:800}.l{fill:#e2e8f0;font-size:17px;font-weight:700}.b{fill:#cbd5e1;font-size:13px}.s{fill:#94a3b8;font-size:12px}.card{fill:#0b1220;stroke:#263244;stroke-width:1.3}.line{fill:none;stroke-width:2.4;marker-end:url(#a)} </style></defs>
  <rect width="1200" height="470" rx="26" fill="url(#bg)"/><text x="48" y="54" class="h">Operational model</text><text x="48" y="81" class="b">Cache decisions stay separate from read and write routing.</text>
  <g transform="translate(48 125)"><rect width="185" height="92" rx="14" class="card" stroke="#38bdf8"/><text x="18" y="31" class="l">Shell context</text><text x="18" y="56" class="b mono">profile + view + zone</text><text x="18" y="77" class="s">defaults, env, flags</text></g>
  <path d="M233 171h34" class="line" stroke="#64748b"/>
  <g transform="translate(267 105)"><rect width="220" height="132" rx="14" class="card" stroke="#22c55e"/><text x="18" y="31" class="l">Cache decision</text><text x="18" y="58" class="b">fresh → return now</text><text x="18" y="80" class="b">stale in SWR → return + refresh</text><text x="18" y="102" class="b">missing/expired → WAPI read</text></g>
  <path d="M487 140h52" class="line" stroke="#38bdf8"/><path d="M487 205h52" class="line" stroke="#fbbf24"/>
  <g transform="translate(539 92)"><rect width="250" height="86" rx="14" class="card" stroke="#38bdf8"/><text x="18" y="31" class="l">Read-only GET lane</text><text x="18" y="55" class="b">validated read endpoint</text><text x="18" y="73" class="s">optional primary worker share</text></g>
  <g transform="translate(539 193)"><rect width="250" height="86" rx="14" class="card" stroke="#fbbf24"/><text x="18" y="31" class="l">Refresh workers</text><text x="18" y="55" class="b">bounded pool + preload</text><text x="18" y="73" class="s">leases + one batch revalidation</text></g>
  <path d="M789 135h35" class="line" stroke="#38bdf8"/><path d="M789 236h35" class="line" stroke="#fbbf24"/>
  <g transform="translate(824 92)"><rect width="170" height="86" rx="14" class="card" stroke="#38bdf8"/><text x="18" y="31" class="l">Read endpoint</text><text x="18" y="55" class="b">GET /allrecords</text><text x="18" y="73" class="s">SOA and IPAM reads</text></g>
  <g transform="translate(824 193)"><rect width="170" height="86" rx="14" class="card" stroke="#fbbf24"/><text x="18" y="31" class="l">Badger cache</text><text x="18" y="55" class="b">DNS, IPAM, VLAN rows</text><text x="18" y="73" class="s">serial renewal / SWR</text></g>
  <g transform="translate(267 302)"><rect width="220" height="78" rx="14" class="card" stroke="#22c55e"/><text x="18" y="30" class="l">Write lane</text><text x="18" y="54" class="b">create · edit · delete</text><text x="18" y="70" class="s">next-IP function calls</text></g><path d="M487 341h52" class="line" stroke="#22c55e"/>
  <g transform="translate(539 302)"><rect width="250" height="78" rx="14" class="card" stroke="#22c55e"/><text x="18" y="30" class="l">Primary Grid Master</text><text x="18" y="54" class="b">writes and next-IP only</text><text x="18" y="70" class="s">POST · PUT · DELETE</text></g><path d="M789 341h35" class="line" stroke="#22c55e"/>
  <g transform="translate(824 302)"><rect width="170" height="78" rx="14" class="card" stroke="#f87171"/><text x="18" y="30" class="l">Audit branch</text><text x="18" y="54" class="b">success / failure</text><text x="18" y="70" class="s">redacted JSONL</text></g>
  <text x="48" y="430" class="s">Reads, searches, cache work, completion, and cancelled actions stay quiet.</text>
</svg>
