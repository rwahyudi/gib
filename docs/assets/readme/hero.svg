<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">gib slash ib, Infoblox DNS and IPAM CLI</title>
  <desc id="desc">Operator-focused DNS and IPAM workflows with independent cache, read, and write lanes. Read-only GET traffic can use a validated read endpoint; writes and next-IP calls stay on the primary Grid Master.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset=".58" stop-color="#0f172a"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.eyebrow{fill:#7dd3fc;font-size:15px;font-weight:700;letter-spacing:2.4px}.title{fill:#f8fafc;font-size:94px;font-weight:800;letter-spacing:-4px}.subtitle{fill:#cbd5e1;font-size:27px;font-weight:500}.small{fill:#cbd5e1;font-size:15px}.terminal{fill:#020617;stroke:#334155;stroke-width:1.4}.panel{fill:#0b1220;stroke:#1e293b;stroke-width:1.2}.rule{stroke:#263244;stroke-width:1}.cyan{fill:#38bdf8}.green{fill:#22c55e}.amber{fill:#fbbf24}.red{fill:#f87171}
    </style>
  </defs>
  <rect width="1200" height="380" rx="30" fill="url(#bg)"/>
  <path d="M58 312 C210 250 280 354 430 292 S700 232 824 290 S1010 328 1142 250" fill="none" stroke="#1e293b" stroke-width="2"/>
  <g transform="translate(58 54)">
    <text class="eyebrow">INFOBLOX DNS + IPAM CLI</text><text y="92" class="title">gib</text><text x="176" y="92" class="mono" fill="#38bdf8" font-size="41" font-weight="800">/ ib</text>
    <text y="142" class="subtitle">Fast shell workflows for DNS, IPAM, and VLANs.</text><text y="180" class="subtitle">Safe writes. Cache-backed search.</text>
    <g transform="translate(0 225)"><rect width="148" height="42" rx="21" fill="#082f49" stroke="#0369a1"/><text x="22" y="27" class="small mono">dns create</text><rect x="164" width="138" height="42" rx="21" fill="#052e16" stroke="#15803d"/><text x="186" y="27" class="small mono">net next-ip</text><rect x="318" width="178" height="42" rx="21" fill="#211c0b" stroke="#a16207"/><text x="340" y="27" class="small mono">stale-while-refresh</text></g>
  </g>
  <g transform="translate(662 44)">
    <rect width="478" height="292" rx="18" class="terminal"/><rect width="478" height="38" rx="18" fill="#111827"/><circle cx="24" cy="19" r="5.5" class="red"/><circle cx="45" cy="19" r="5.5" class="amber"/><circle cx="66" cy="19" r="5.5" class="green"/><text x="94" y="25" class="mono" fill="#64748b" font-size="13">operator@grid</text>
    <text x="24" y="68" class="mono" fill="#a7f3d0" font-size="16" font-weight="700">$</text><text x="48" y="68" class="mono" fill="#f8fafc" font-size="16">ib dns search app --global</text>
    <rect x="24" y="90" width="430" height="96" rx="10" class="panel"/><text x="42" y="118" class="mono cyan" font-size="14" font-weight="700">TYPE</text><text x="122" y="118" class="mono cyan" font-size="14" font-weight="700">NAME</text><text x="270" y="118" class="mono cyan" font-size="14" font-weight="700">VALUE</text><line x1="42" y1="132" x2="436" y2="132" class="rule"/><text x="42" y="158" class="mono green" font-size="15" font-weight="700">A</text><text x="122" y="158" class="mono" fill="#e2e8f0" font-size="15">app01</text><text x="270" y="158" class="mono" fill="#e2e8f0" font-size="15">192.0.2.10</text><text x="42" y="179" class="mono amber" font-size="15" font-weight="700">HOST</text><text x="122" y="179" class="mono" fill="#e2e8f0" font-size="15">api-prod</text><text x="270" y="179" class="mono" fill="#e2e8f0" font-size="15">192.0.2.32</text>
    <g transform="translate(25 211)"><rect width="126" height="48" rx="10" fill="#082f49" stroke="#0369a1"/><text x="18" y="29" class="mono" fill="#bae6fd" font-size="14">GET read path</text><path d="M137 24 H181" stroke="#38bdf8" stroke-width="2"/><rect x="190" width="94" height="48" rx="10" fill="#052e16" stroke="#15803d"/><text x="208" y="29" class="mono" fill="#bbf7d0" font-size="14">Badger</text><path d="M296 24 H340" stroke="#22c55e" stroke-width="2"/><rect x="350" width="82" height="48" rx="10" fill="#211c0b" stroke="#a16207"/><text x="364" y="20" class="mono" fill="#fde68a" font-size="12">WRITE</text><text x="363" y="37" class="mono" fill="#fde68a" font-size="12">primary</text></g>
  </g>
</svg>
