<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">ib write audit flow</title>
  <desc id="desc">DNS and configuration writes can emit redacted JSONL audit events for success and failure. Reads, searches, cache operations, completion, and cancelled actions remain quiet. Audit sink failures warn without failing a completed write.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.h{fill:#f8fafc;font-size:24px;font-weight:800}.l{fill:#e2e8f0;font-size:15px;font-weight:700}.b{fill:#cbd5e1;font-size:12px}.s{fill:#94a3b8;font-size:11px}.card{fill:#0b1220;stroke:#263244;stroke-width:1.3}.line{fill:none;stroke-width:2.2;marker-end:url(#a)}</style></defs>
  <rect width="980" height="390" rx="24" fill="url(#bg)"/><rect x="28" y="28" width="924" height="334" rx="18" fill="#0b1220" stroke="#263244"/><text x="55" y="67" class="h">Write audit flow</text><text x="55" y="91" class="b">Opt-in JSONL events preserve the outcome without exposing attempted secrets.</text>
  <g transform="translate(55 137)"><rect width="205" height="82" rx="14" class="card" stroke="#22c55e"/><text x="20" y="31" class="l">Write action</text><text x="20" y="55" class="b">DNS record / zone</text><text x="20" y="72" class="s">or config profile</text></g><path d="M260 178h42" class="line" stroke="#22c55e"/>
  <g transform="translate(302 120)"><rect width="230" height="116" rx="14" class="card" stroke="#38bdf8"/><text x="20" y="31" class="l">Result</text><text x="20" y="58" class="b">success or WAPI failure</text><text x="20" y="80" class="b">PTR side effects included</text><text x="20" y="101" class="s">cancelled actions stop here</text></g><path d="M532 178h42" class="line" stroke="#f87171"/>
  <g transform="translate(574 108)"><rect width="325" height="140" rx="14" class="card" stroke="#f87171"/><text x="20" y="31" class="l">Optional JSONL audit event</text><text x="20" y="57" class="mono b">result: success | failure</text><text x="20" y="78" class="mono b">target + operation + profile</text><text x="20" y="99" class="mono b">data: redacted</text><text x="20" y="122" class="s">file · syslog · Windows Event Log</text></g>
  <rect x="55" y="282" width="844" height="44" rx="12" fill="#111827" stroke="#334155"/><text x="75" y="309" class="b">Quiet by design: reads · searches · cache work · completion · cancelled actions. Sink warnings do not undo a completed write.</text>
</svg>
