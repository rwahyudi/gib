<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">ib cache freshness and stale-while-revalidate decision flow</title>
  <desc id="desc">Fresh cache rows return immediately when now is earlier than cached_at plus cache_ttl. Rows inside the stale-while-revalidate window return immediately and queue lease-protected refresh. Matching DNS serials renew rows locally; missing or changed data uses a foreground or background WAPI read.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#111827"/></linearGradient><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.h{fill:#f8fafc;font-size:23px;font-weight:800}.l{fill:#e2e8f0;font-size:15px;font-weight:700}.b{fill:#cbd5e1;font-size:12px}.s{fill:#94a3b8;font-size:11px}.card{fill:#0b1220;stroke:#263244;stroke-width:1.3}.line{fill:none;stroke-width:2.2;marker-end:url(#a)}</style></defs>
  <rect width="980" height="500" rx="24" fill="url(#bg)"/><rect x="28" y="28" width="924" height="444" rx="18" fill="#0b1220" stroke="#263244"/><text x="55" y="67" class="h">Cache decision flow</text><text x="55" y="91" class="b">Freshness is calculated from timestamps; SWR keeps reads responsive while refresh runs.</text>
  <g transform="translate(55 133)"><rect width="165" height="65" rx="13" class="card" stroke="#38bdf8"/><text x="20" y="29" class="l">Read request</text><text x="20" y="49" class="b">DNS · IPAM · VLAN</text></g><path d="M220 165h42" class="line" stroke="#38bdf8"/>
  <g transform="translate(262 123)"><rect width="210" height="85" rx="13" class="card" stroke="#38bdf8"/><text x="18" y="29" class="l">Read cache row</text><text x="18" y="52" class="b">scope + cached_at</text><text x="18" y="70" class="s">cache_ttl / SWR window</text></g>
  <path d="M472 145h40M472 190h40M472 235h40" class="line" stroke="#64748b"/>
  <g transform="translate(512 110)"><rect width="180" height="70" rx="13" class="card" stroke="#22c55e"/><text x="18" y="28" class="l">Fresh</text><text x="18" y="49" class="b">now &lt; cached_at + cache_ttl</text><text x="18" y="64" class="s">return immediately</text></g>
  <g transform="translate(512 195)"><rect width="180" height="70" rx="13" class="card" stroke="#fbbf24"/><text x="18" y="28" class="l">Stale inside SWR</text><text x="18" y="49" class="b">return cached rows</text><text x="18" y="64" class="s">queue lease-protected refresh</text></g>
  <g transform="translate(512 280)"><rect width="180" height="70" rx="13" class="card" stroke="#f87171"/><text x="18" y="28" class="l">Missing / expired</text><text x="18" y="49" class="b">foreground WAPI read</text><text x="18" y="64" class="s">unless refresh completes first</text></g>
  <path d="M692 145h42M692 230h42M692 315h42" class="line" stroke="#64748b"/>
  <g transform="translate(734 110)"><rect width="165" height="70" rx="13" class="card" stroke="#22c55e"/><text x="18" y="28" class="l">Return fresh</text><text x="18" y="49" class="b">no Infoblox call</text></g>
  <g transform="translate(734 195)"><rect width="165" height="70" rx="13" class="card" stroke="#fbbf24"/><text x="18" y="28" class="l">Return stale</text><text x="18" y="49" class="b">refresh in background</text></g>
  <g transform="translate(734 280)"><rect width="165" height="70" rx="13" class="card" stroke="#f87171"/><text x="18" y="28" class="l">Refresh rows</text><text x="18" y="49" class="b">DNS serial or /allrecords</text><text x="18" y="64" class="s">IPAM/VLAN skips serial</text></g>
  <rect x="55" y="390" width="844" height="45" rx="12" fill="#082f49" stroke="#0369a1"/><text x="74" y="418" class="b">DNS matching SOA serial renews cached_at locally. IPAM list/search may serve older rows; --refresh forces foreground WAPI data.</text>
</svg>
